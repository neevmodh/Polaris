<div class="atlas">
  <div class="map-toolbar"><span>NOIDA & AHMEDABAD · REGIONAL COVERAGE</span><div>
    <button type="button" data-action="in" aria-label="Zoom map in">+</button>
    <button type="button" data-action="out" aria-label="Zoom map out">−</button>
    <button type="button" data-action="fit" aria-label="Show both cities">Both cities</button>
    <button type="button" data-action="focus" aria-label="Focus selected station">Focus city</button>
  </div></div>
  <div class="map-stage"><svg class="world-map" viewBox="-15 -15 1030 530" aria-label="Interactive greenhouse gas station map" role="group"></svg></div>

  <div class="station-picker" aria-label="Stations on map"></div>
</div>
